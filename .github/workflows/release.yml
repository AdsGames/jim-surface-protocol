name: Release

on:
  push:
    tags:
      - v*
  pull_request:
    branches:
      - main

jobs:
  release:
    uses: adsgames/deploy-to-adsgames/.github/workflows/release-game.yml@v1
    permissions:
      id-token: write
      contents: read
    with:
      project-id: ab9e16b7-d318-46d3-a8c9-bf171475afa1
      # Pull requests only check that every platform builds, and dry run adsgames.json
      deploy: ${{ startsWith(github.ref, 'refs/tags/v') }}
    secrets:
      ADSGAMES_API_KEY: ${{ secrets.ADSGAMES_API_KEY }}

  itch:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    uses: adsgames/deploy-to-adsgames/.github/workflows/deploy-itch.yml@v1
    with:
      itch-project: ads-games/j1m-surface-protocol
      # Keeps the channel the web build was already published on
      channels: '{"WEB": "HTML5", "LINUX": "linux", "WINDOWS": "windows", "MAC": "mac"}'
    secrets:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
